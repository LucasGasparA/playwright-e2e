name: Testes Playwright e SonarCloud

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  schedule:
    - cron: '0 12 * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-e2e:
    name: Executar testes E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps

      - name: Executar testes
        run: npm run actions

  sonarcloud:
    name: Analisar com SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o codigo com historico
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Executar analise do SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
